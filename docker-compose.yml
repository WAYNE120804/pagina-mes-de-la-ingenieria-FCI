services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - plantilla_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${FRONTEND_VITE_API_URL:-https://api.example.com/api}
    restart: unless-stopped
    networks:
      - plantilla_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3002}
      DATABASE_URL: ${BACKEND_DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - plantilla_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantilla}
      POSTGRES_USER: ${POSTGRES_USER:-plantilla_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plantilla_net

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  plantilla_net:
    driver: bridge
